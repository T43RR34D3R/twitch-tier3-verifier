# Tier3 Chat Relay Configuration
# Configure the connection to your Tier 3 Toolkit web application

# Web Application Settings
webapp:
  # The URL of your Tier 3 Toolkit instance
  url: "http://localhost:3000"
  
  # The endpoint for sending chat messages TO the web app
  endpoint: "/api/minecraft/chat-stream"
  
  # The endpoint for receiving messages FROM the web app
  receive_endpoint: "/api/minecraft/receive-messages"
  
  # Connection timeout in milliseconds
  timeout: 5000
  
  # Retry attempts for failed requests
  retry_attempts: 3

# Chat Settings
chat:
  # Enable/disable the chat relay (sending messages to web app)
  enabled: true
  
  # Enable/disable receiving messages from web app
  receive_enabled: false
  
  # How often to poll for new messages from web app (in seconds)
  poll_interval: 30
  
  # Only relay messages from these worlds (empty = all worlds)
  allowed_worlds: []
  
  # Filter out messages from these players (useful for bots)
  blocked_players: []
  
  # Include server messages (join/leave notifications)
  include_server_messages: false
  
  # Include private messages
  include_private_messages: false

# Security Settings
security:
  # API key for authentication (optional, leave empty if not needed)
  api_key: ""
  
  # Only allow connections from these IPs (empty = allow all)
  allowed_ips: []

# Debug Settings
debug:
  # Enable debug logging
  enabled: false
  
  # Log all HTTP requests
  log_requests: false
