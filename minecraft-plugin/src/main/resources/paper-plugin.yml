name: Tier3ChatRelay
version: 1.0.0
main: com.tier3toolkit.chatrelay.Tier3ChatRelay
api-version: '1.21'
author: Tier3Toolkit
description: Relays Minecraft chat messages to Tier 3 Toolkit web overlay
website: https://github.com/your-repo/tier3-toolkit

permissions:
  tier3chat.admin:
    description: Allows administration of Tier3 Chat Relay
    default: op
  tier3chat.reload:
    description: Allows reloading the plugin configuration
    default: op
