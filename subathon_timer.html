<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subathon Timer</title>
    <style>
@font-face {
            font-family: 'Deadly';
            src: url('DEADLY.OTF') format('opentype');
        }

        body:before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('https://www.example.com/skulls-pattern.jpg') center/cover no-repeat;
            opacity: 0.1;
            z-index: -1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #0d0d0d 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #e0e0e0;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(120, 119, 198, 0.15) 0%, transparent 50%);
            z-index: -1;
        }

        .container {
            background: rgba(10, 10, 15, 0.92);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 50px;
            box-shadow: 
                0 25px 50px -12px rgba(0, 0, 0, 0.8),
                0 0 0 1px rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(120, 119, 198, 0.2);
            text-align: center;
            max-width: 700px;
            width: 90%;
            position: relative;
        }

        .container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(120, 119, 198, 0.1) 0%, transparent 100%);
            border-radius: 20px;
            pointer-events: none;
        }

        h1 {
            font-family: 'Deadly', 'Arial Black', sans-serif;
            font-size: 3.5rem;
            margin-bottom: 40px;
            background: linear-gradient(135deg, #ffffff 0%, #a0a0a0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.5));
        }

        #timer {
            font-family: 'Deadly', monospace;
            font-size: 5rem;
            font-weight: 900;
            margin: 40px 0;
            background: linear-gradient(135deg, #ffffff 0%, #d0d0d0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            letter-spacing: 0.1em;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.8));
            position: relative;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            margin-top: 40px;
        }

        .controls button {
            background: linear-gradient(135deg, rgba(20, 20, 25, 0.8) 0%, rgba(40, 40, 50, 0.8) 100%);
            border: 2px solid rgba(120, 119, 198, 0.3);
            border-radius: 12px;
            padding: 16px 28px;
            color: #e0e0e0;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 
                0 4px 15px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .controls button::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(120, 119, 198, 0.2), transparent);
            transition: left 0.5s;
        }

        .controls button:hover {
            transform: translateY(-2px);
            box-shadow: 
                0 8px 25px rgba(0, 0, 0, 0.4),
                0 0 20px rgba(120, 119, 198, 0.2);
            border-color: rgba(120, 119, 198, 0.5);
        }

        .controls button:hover::before {
            left: 100%;
        }

        .controls button:active {
            transform: translateY(0);
        }

        .status {
            margin-top: 30px;
            font-size: 1.2rem;
            opacity: 0.8;
            color: #b0b0b0;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        .running {
            animation: pulse 2s infinite;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 2.5rem;
            }
            
            #timer {
                font-size: 2.5rem;
            }
            
            .controls {
                flex-direction: column;
                align-items: center;
            }
            
            .controls button {
                width: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>SUBATHON TIMER</h1>
        <div id="timer">00:00:00</div>
        <div class="status" id="status">Timer Stopped</div>
        <div class="controls">
            <button onclick="setTime()">⏰ Set Time</button>
            <button class="pause" onclick="pauseTimer()">⏸️ Pause</button>
            <button class="start" onclick="startTimer()">▶️ Start</button>
            <button class="add" onclick="addTime()">➕ Add 5 Min</button>
            <button class="remove" onclick="removeTime()">➖ Remove 5 Min</button>
        </div>
    </div>
    <script>
        let timerInterval;
        let timeInSeconds = 0;
        let isRunning = false;

        function displayTime() {
            // Ensure timeInSeconds is a valid number
            const safeTime = isNaN(timeInSeconds) || timeInSeconds < 0 ? 0 : Math.floor(timeInSeconds);
            const hours = String(Math.floor(safeTime / 3600)).padStart(2, '0');
            const minutes = String(Math.floor((safeTime % 3600) / 60)).padStart(2, '0');
            const seconds = String(Math.floor(safeTime % 60)).padStart(2, '0');
            document.getElementById('timer').innerText = `${hours}:${minutes}:${seconds}`;
            
            // Add visual feedback when timer is running
            const timerElement = document.getElementById('timer');
            if (isRunning) {
                timerElement.classList.add('running');
            } else {
                timerElement.classList.remove('running');
            }
        }

        function updateStatus(message) {
            document.getElementById('status').innerText = message;
        }

        function setTime() {
            const time = prompt("Enter time in HH:MM:SS (e.g., 01:30:00 for 1 hour 30 minutes)");
            if (time && time.match(/^\d{1,2}:\d{2}:\d{2}$/)) {
                const parts = time.split(':');
                timeInSeconds = (+parts[0] * 3600) + (+parts[1] * 60) + (+parts[2]);
                displayTime();
                updateStatus(`Timer set to ${time}`);
            } else if (time) {
                alert("Please enter time in HH:MM:SS format (e.g., 01:30:00)");
            }
        }

        function startTimer() {
            if (!isRunning && timeInSeconds > 0) {
                isRunning = true;
                updateStatus("⏳ Timer Running...");
                timerInterval = setInterval(() => {
                    timeInSeconds--;
                    if (timeInSeconds <= 0) {
                        timeInSeconds = 0;
                        pauseTimer();
                        updateStatus("🎉 Timer Finished!");
                        // Add celebration effect
                        document.getElementById('timer').style.animation = 'pulse 0.5s ease-in-out 3';
                        setTimeout(() => {
                            document.getElementById('timer').style.animation = '';
                        }, 1500);
                    }
                    displayTime();
                }, 1000);
            } else if (timeInSeconds === 0) {
                updateStatus("Please set a time first!");
            }
        }

        function pauseTimer() {
            if (isRunning) {
                isRunning = false;
                clearInterval(timerInterval);
                updateStatus("⏸️ Timer Paused");
                displayTime();
            }
        }

        function addTime() {
            timeInSeconds += 300; // Add 5 minutes
            displayTime();
            updateStatus("➕ Added 5 minutes!");
        }

        function removeTime() {
            const oldTime = timeInSeconds;
            timeInSeconds = Math.max(0, timeInSeconds - 300); // Remove 5 minutes
            displayTime();
            if (oldTime > 0) {
                updateStatus("➖ Removed 5 minutes!");
            } else {
                updateStatus("Cannot remove time - timer at 00:00:00");
            }
        }

        // Initialize on page load
        window.onload = function() {
            displayTime();
            updateStatus("Timer Ready - Set time to begin!");
        };
    </script>
</body>
</html>
